version: '3.8'

services:
  # 后端API服务
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    volumes:
      - .:/app
    command: uv run python simple_api.py

  # 数据库服务 (后期使用)
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: course_review
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - database

  # Redis缓存服务 (后期使用)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles:
      - database

volumes:
  postgres_data: